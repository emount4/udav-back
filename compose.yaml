x-database-env: &database-env
  DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:5432?sslmode=disable}"
  PGUSER: "${POSTGRES_USER:-udav}"
  PGPASSWORD: "${POSTGRES_PASSWORD:-udav_dev}"
  PGDATABASE: "${POSTGRES_DB:-udav}"

services:
  api:
    build:
      context: .
      target: api
    environment:
      <<: *database-env
      PORT: "8080"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LOG_FILE: "${LOG_FILE:-logs/api.log}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - api_logs:/var/lib/udav
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-udav}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-udav_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-udav}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  s3:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-s3.autoCreateBucket=false"]
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-udav_local}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-udav_local_dev}"
      S3_BUCKET: "${S3_BUCKET:-udav-assets},${S3_UPLOAD_BUCKET:-udav-uploads}"
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  api_logs:
  postgres_data:
  s3_data:
