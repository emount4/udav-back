services:
  api:
    build: .
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LOG_FILE: "${LOG_FILE:-logs/api.log}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:5432?sslmode=disable}"
      PGUSER: "${POSTGRES_USER:-udav}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-udav_dev}"
      PGDATABASE: "${POSTGRES_DB:-udav}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - api_logs:/var/lib/udav
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-udav}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-udav_dev}"
      POSTGRES_DB: "${POSTGRES_DB:-udav}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  api_logs:
  postgres_data:
